name: Build WeKnora Lite (macOS Intel / Windows x64)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: false
        default: all
        type: choice
        options:
          - all
          - windows
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Tencent/WeKnora
          ref: f17ee8a8da901bd658a4cb25f40b5fd41adbfdd7
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
  macos:
    needs: frontend
    if: github.event.inputs.target != 'windows'
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      CGO_ENABLED: '1'
      GOOS: darwin
      GOARCH: amd64
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      GOMAXPROCS: '3'
      GOMEMLIMIT: 8GiB
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Tencent/WeKnora
          ref: f17ee8a8da901bd658a4cb25f40b5fd41adbfdd7
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/
      - name: Compile Lite
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          export CGO_CFLAGS="-Wno-deprecated-declarations"
          export CGO_LDFLAGS="-Wl,-no_warn_duplicate_libraries"
          go build -p 2 -tags sqlite_fts5 \
            -ldflags="-w -s -X github.com/Tencent/WeKnora/internal/handler.Version=v0.9.0 -X github.com/Tencent/WeKnora/internal/handler.Edition=lite -X github.com/Tencent/WeKnora/internal/handler.CommitID=f17ee8a -X google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn" \
            -o WeKnora-lite ./cmd/server
          file WeKnora-lite
          otool -L WeKnora-lite
          codesign --force --sign - WeKnora-lite
      - name: Package
        shell: bash
        run: |
          pkg=WeKnora-lite_v0.9.0_darwin_amd64
          mkdir -p "$pkg/web" "$pkg/migrations"
          cp WeKnora-lite "$pkg/"
          cp -R web/. "$pkg/web/"
          cp -R config "$pkg/"
          cp -R migrations/sqlite "$pkg/migrations/"
          cp .env.lite.example "$pkg/"
          cp docs/LITE.md "$pkg/README.md"
          cp -R "$(go env GOMODCACHE)/github.com/yanyiwu/gojieba@v1.4.7/deps/cppjieba/dict" "$pkg/dict"
          printf '%s\n' '#!/bin/sh' 'set -eu' 'cd "$(dirname "$0")"' 'export JIEBA_DICT_DIR="$PWD/dict"' 'exec ./WeKnora-lite' > "$pkg/start.sh"
          chmod +x "$pkg/start.sh"
          bash scripts/copy-licenses.sh "$pkg"
          printf '%s\n' 'Upstream: Tencent/WeKnora' 'Version: v0.9.0' 'Commit: f17ee8a8da901bd658a4cb25f40b5fd41adbfdd7' 'Platform: darwin/amd64' > "$pkg/BUILD.txt"
          tar -czf "$pkg.tar.gz" "$pkg"
          shasum -a 256 "$pkg.tar.gz" > "$pkg.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: WeKnora-lite-v0.9.0-darwin-amd64
          path: |
            WeKnora-lite_v0.9.0_darwin_amd64.tar.gz
            WeKnora-lite_v0.9.0_darwin_amd64.tar.gz.sha256
          retention-days: 7
  windows:
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: '1'
      GOOS: windows
      GOARCH: amd64
      GOMAXPROCS: '3'
      GOMEMLIMIT: 8GiB
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Tencent/WeKnora
          ref: f17ee8a8da901bd658a4cb25f40b5fd41adbfdd7
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/
      - name: Ensure MinGW toolchain for CGO
        shell: bash
        run: |
          if command -v gcc >/dev/null 2>&1 && command -v g++ >/dev/null 2>&1; then
            echo "mingw already available"
            gcc --version | head -1
            exit 0
          fi
          choco install mingw -y --no-progress
          echo "C:/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin" >> "$GITHUB_PATH"
      - name: Provide sqlite3.h for sqlite-vec CGO
        shell: bash
        run: |
          modcache="$(cygpath -u "$(go env GOMODCACHE)")"
          go mod download github.com/mattn/go-sqlite3
          hdr="$modcache/github.com/mattn/go-sqlite3@v1.14.24/sqlite3-binding.h"
          test -f "$hdr"
          mkdir -p .cgo-headers
          cp "$hdr" .cgo-headers/sqlite3.h
          echo "CGO_CFLAGS=-I$(cygpath -m "$PWD/.cgo-headers") -Wno-deprecated-declarations" >> "$GITHUB_ENV"
      - name: Compile Lite
        shell: bash
        run: |
          gcc --version | head -1
          g++ --version | head -1
          go version
          go build -p 1 -tags sqlite_fts5 \
            -ldflags="-w -s -X github.com/Tencent/WeKnora/internal/handler.Version=v0.9.0 -X github.com/Tencent/WeKnora/internal/handler.Edition=lite -X github.com/Tencent/WeKnora/internal/handler.CommitID=f17ee8a -X google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn" \
            -o WeKnora-lite.exe ./cmd/server
          ls -lh WeKnora-lite.exe
      - name: Package
        shell: bash
        run: |
          pkg=WeKnora-lite_v0.9.0_windows_amd64
          rm -rf "$pkg"
          mkdir -p "$pkg/web" "$pkg/migrations"
          cp WeKnora-lite.exe "$pkg/"
          cp -R web/. "$pkg/web/"
          cp -R config "$pkg/"
          cp -R migrations/sqlite "$pkg/migrations/"
          cp .env.lite.example "$pkg/"
          cp docs/LITE.md "$pkg/README.md"
          modcache="$(cygpath -u "$(go env GOMODCACHE)")"
          cp -R "$modcache/github.com/yanyiwu/gojieba@v1.4.7/deps/cppjieba/dict" "$pkg/dict"
          printf '@echo off\r\ncd /d "%%~dp0"\r\nset "JIEBA_DICT_DIR=%%~dp0dict"\r\n"WeKnora-lite.exe"\r\n' > "$pkg/start.cmd"
          bash scripts/copy-licenses.sh "$pkg"
          printf 'Upstream: Tencent/WeKnora\nVersion: v0.9.0\nCommit: f17ee8a8da901bd658a4cb25f40b5fd41adbfdd7\nPlatform: windows/amd64\n' > "$pkg/BUILD.txt"
          powershell -NoProfile -Command "Compress-Archive -Path '$pkg' -DestinationPath '$pkg.zip' -Force"
          sha256sum "$pkg.zip" > "$pkg.zip.sha256"
          ls -lh "$pkg.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: WeKnora-lite-v0.9.0-windows-amd64
          path: |
            WeKnora-lite_v0.9.0_windows_amd64.zip
            WeKnora-lite_v0.9.0_windows_amd64.zip.sha256
          retention-days: 7
